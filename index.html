<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام | صورتی زرد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="register-card">
        <h1>ثبت‌نام</h1>
        <div class="subhead">به خانواده صورتی-زرد خوش آمدید</div>

        <form action="#" method="post">
            <!-- نام کاربری -->
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" placeholder="مثلاً: sara_rose" required>
            </div>

            <!-- ایمیل -->
            <div class="form-group">
                <label for="email">ایمیل</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>

            <!-- رمز عبور -->
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                <div class="password-hint">حداقل ۸ کاراکتر شامل عدد و حرف</div>
            </div>

            <!-- تأیید رمز عبور -->
            <div class="form-group">
                <label for="confirm-password">تکرار رمز عبور</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
            </div>

            <!-- قوانین و شرایط -->
            <div class="terms">
                <label>
                    <input type="checkbox" required>
                    <span>با <a href="#">قوانین و مقررات</a> موافقم</span>
                </label>
            </div>

            <!-- دکمه ثبت‌نام -->
            <button type="submit" class="btn-register">ثبت‌نام کن</button>

            <!-- لینک ورود -->
            <div class="login-link">
                قبلاً ثبت‌نام کردی؟ <a href="#">وارد شو</a>
            </div>
        </form>
    </div>
</body>
</html>

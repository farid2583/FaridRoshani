<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="register-container">

        <!-- سمت تزئینی -->
        <div class="register-side">
            <div class="icon">🌸</div>
            <h2>خوش آمدید!</h2>
            <p>برای استفاده از امکانات سایت، لطفاً ثبت‌نام کنید و به جمع ما بپیوندید.</p>
        </div>

        <!-- فرم ثبت‌نام -->
        <div class="register-form">
            <h1>ایجاد حساب کاربری</h1>
            <p class="subtitle">اطلاعات خود را وارد کنید</p>

            <form action="#" method="post">
                <div class="input-group">
                    <label for="name">نام و نام خانوادگی</label>
                    <input type="text" id="name" name="name" placeholder="مثلاً زهرا احمدی" required>
                    <span class="input-icon">👤</span>
                </div>

                <div class="input-group">
                    <label for="email">ایمیل</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    <span class="input-icon">✉️</span>
                </div>

                <div class="input-group">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" name="password" placeholder="حداقل ۸ کاراکتر" required>
                    <span class="input-icon">🔒</span>
                </div>

                <div class="input-group">
                    <label for="confirm-password">تکرار رمز عبور</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="رمز را دوباره وارد کنید" required>
                    <span class="input-icon">🔑</span>
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">با <a href="#">قوانین و مقررات</a> موافقم</label>
                </div>

                <button type="submit" class="btn-register">ثبت نام</button>
            </form>

            <p class="login-link">
                قبلاً ثبت‌نام کرده‌اید؟ <a href="#">وارد شوید</a>
            </p>
        </div>

    </div>

</body>
</html>
